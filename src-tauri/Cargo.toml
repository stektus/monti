[package]
name = "monti"
version = "0.7.0"
description = "Mount your clouds. Google Drive, Dropbox and more as local folders on Linux."
authors = ["Monti contributors"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# Desktop notifications straight from Rust. The Tauri plugin wraps the same
# crate but throws the send result away, which hides a missing daemon.
notify-rust = { version = "4", default-features = false, features = ["z"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
libc = "0.2"
# Native folder chooser. GTK3 rather than the XDG portal on purpose: Monti
# is a GTK app already, so the dialog needs no portal service running and
# appears on the app's own display like the rest of it.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

