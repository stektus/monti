name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      # The tests talk to a real rclone: they spawn the daemon, and three of
      # them stand up a WebDAV, S3 and SFTP server on localhost and mount it.
      # Ubuntu's package is years behind (no `rclone serve s3`), so the
      # release build is pinned by checksum instead.
      - name: Install rclone and FUSE for the tests
        run: |
          set -euo pipefail
          sudo apt-get install -y fuse3 unzip
          curl -fsSL -o /tmp/rclone.zip \
            https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          echo "aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  /tmp/rclone.zip" \
            | sha256sum -c -
          unzip -q -d /tmp /tmp/rclone.zip
          sudo install -m755 /tmp/rclone-v1.75.0-linux-amd64/rclone /usr/local/bin/rclone
          rclone version | head -1

      - name: cargo test
        working-directory: src-tauri
        # Every test that gives up says why. A skip is a legitimate result on
        # a machine without FUSE, but it must not read as a pass: whatever was
        # skipped is raised as an annotation on the run, where it is visible
        # without opening the log.
        run: |
          set -euo pipefail
          cargo test -- --nocapture 2>&1 | tee /tmp/test.log
          if grep -q "skipped —" /tmp/test.log; then
            grep "skipped —" /tmp/test.log | while read -r line; do
              echo "::warning::$line"
            done
          else
            echo "::notice::every provider round trip ran, mounts included"
          fi

      - name: JS syntax check
        run: |
          for f in src/main.js src/i18n.js src/locales/*.js; do
            node --check "$f"
          done

      # A translation fails quietly — the phrase just stays English — so the
      # check has to be here rather than in someone's eyes.
      - name: Translations
        run: node scripts/check-translations.mjs
