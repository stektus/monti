# Flatpak manifest — groundwork for a Flathub submission.
#
# ВАЖНО / IMPORTANT: FUSE mounts from inside the flatpak sandbox are the
# hard part. `rclone mount` needs /dev/fuse and a host fusermount3; plain
# --device=dri is not enough. Before submitting to Flathub this needs
# real testing with --device=all and (likely) a fusermount wrapper via
# flatpak-spawn --host. Until then, AppImage/.deb/.rpm/AUR are the
# supported channels. See packaging/flatpak/README.md.

id: io.github.stektus.monti
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: monti

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all # /dev/fuse for rclone mount
  - --share=network # cloud APIs + localhost RC daemon
  - --share=ipc
  - --talk-name=org.kde.StatusNotifierWatcher # tray
  - --filesystem=home # mount points live in $HOME

modules:
  - name: monti
    buildsystem: simple
    build-commands:
      - ar -x Monti_*.deb
      - tar -xf data.tar.gz
      - cp -r usr/bin /app/bin
      - cp -r usr/share /app/share
      - install -Dm644 io.github.stektus.monti.metainfo.xml
        /app/share/metainfo/io.github.stektus.monti.metainfo.xml
    sources:
      - type: file
        url: https://github.com/stektus/monti/releases/download/v0.3.0/Monti_0.3.0_amd64.deb
        sha256: TODO_FILL_FROM_RELEASE
      - type: file
        path: io.github.stektus.monti.metainfo.xml
