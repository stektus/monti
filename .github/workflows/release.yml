name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          v=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match tauri.conf.json version $v"
            exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles
        run: npm run tauri build 2>&1 | tee /tmp/build.log

      # linuxdeploy bundles libraries from the build machine that must come
      # from the host instead. Ours are older, and a host driver that loads
      # them misses the symbols it needs: the bundled libwayland-client
      # (wayland 1.20) is why Mesa's EGL failed and the window turned white
      # in v0.4.3 and v0.4.4. The list is vendored, so a build cannot change
      # meaning because someone edited a file upstream.
      - name: Unbundle host libraries from the AppImage
        run: |
          set -euo pipefail
          list=$PWD/.github/appimage-host-libs.txt
          grep -vE '^\s*#|^\s*$' "$list" | sort -u > /tmp/host-libs
          cd src-tauri/target/release/bundle/appimage
          img=$(ls ./*.AppImage | head -1)
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" \
            | sha256sum -c -
          chmod +x /tmp/appimagetool
          rm -rf squashfs-root
          "$img" --appimage-extract > /dev/null
          while read -r lib; do
            if [ -e "squashfs-root/usr/lib/$lib" ]; then
              echo "unbundling $lib"
              rm -f "squashfs-root/usr/lib/$lib"
            fi
          done < /tmp/host-libs
          rm -f "$img"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool squashfs-root "$img"
          rm -rf squashfs-root
          # Guard: none of them may survive into the shipped image.
          "$img" --appimage-extract > /dev/null
          left=$(ls squashfs-root/usr/lib | sort -u | comm -12 /tmp/host-libs - || true)
          if [ -n "$left" ]; then
            echo "::error::host libraries are still bundled: $left"
            exit 1
          fi
          rm -rf squashfs-root
          ls -l "$img"

      # A build that starts and draws nothing looks identical to a good one
      # from here, so check the pixels — on distributions other than the one
      # that built it.
      - name: Smoke-test the AppImage on other distributions
        run: bash .github/scripts/smoke-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

      # The runner's logs are admin-only; put the build log somewhere the
      # maintainer can actually read when a build dies.
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git reset
          cp /tmp/build.log ci-build.log || true
          git add -f ci-build.log
          git commit -m "build log for ${{ github.ref_name }} run ${{ github.run_id }}"
          git push -f origin ci-logs

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle
          for f in appimage/*.AppImage deb/*.deb rpm/*.rpm; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > SHA256SUMS
          cat SHA256SUMS
          cat > /tmp/notes.md <<'EOF'
          Mount your clouds — download, install, click **Add cloud**.

          | Package | For |
          |---|---|
          | `.AppImage` | any distro — `chmod +x` and run |
          | `.deb` | Debian, Ubuntu, Mint, … |
          | `.rpm` | Fedora, openSUSE, … |

          FUSE3 is required at runtime (preinstalled on most desktop distros).
          `SHA256SUMS` lists checksums for every package; the install script
          verifies them automatically.
          EOF
          gh release create "${{ github.ref_name }}" \
            --title "Monti ${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            appimage/*.AppImage deb/*.deb rpm/*.rpm SHA256SUMS

      # House rule: exactly one published release. Once the new one is
      # live, superseded releases (and their tags) go away.
      - name: Keep only the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --json tagName -q '.[].tagName' \
            | grep -vx "${{ github.ref_name }}" \
            | while read -r t; do
                echo "deleting superseded release $t"
                # --cleanup-tag errors out when the tag is already gone;
                # delete release and tag separately, tolerating absence.
                gh release delete "$t" --repo "${{ github.repository }}" --yes || true
                git push origin --delete "refs/tags/$t" 2>/dev/null || true
              done
