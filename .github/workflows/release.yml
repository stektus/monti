name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be exercised without publishing anything — the release
  # steps below only run for a tag.
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance. A checksum proves a download was not altered on the way
  # to you; it says nothing about where the file came from. These let GitHub
  # sign each package with the workflow and commit that produced it, so anyone
  # can check that the AppImage they are about to run really was built from
  # this repository rather than assembled on somebody's laptop.
  id-token: write
  attestations: write

jobs:
  build:
    # One job per architecture. 22.04 on both, because the glibc of the
    # build machine is the floor every user has to clear (2.35).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            appimagetool_sha: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - runner: ubuntu-22.04-arm
            arch: aarch64
            appimagetool_sha: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        # The tag arrives through the environment, never pasted into the
        # script. git accepts a tag name containing $(...), and a name pasted
        # into a run: block is executed by the shell that receives it — in a
        # job that holds id-token and attestations permissions.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $v"
            exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The bundler fetches its AppImage tooling into ~/.cache/tauri and skips
      # the download when a file is already there. Both builds of v0.9.0 died
      # on "http status: 429" from raw.githubusercontent.com — a shared runner
      # IP being rate-limited, nothing to do with this project — so the files
      # are fetched here instead, patiently, and kept between runs.
      - name: Keep the AppImage tooling between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: appimage-tools-${{ matrix.arch }}-v1

      - name: Fetch the AppImage tooling
        run: |
          set -euo pipefail
          d=~/.cache/tauri
          mkdir -p "$d"
          arch=${{ matrix.arch }}
          # Known good, recorded 2026-08-20. These four files are executed
          # during the build, from mutable tags and a moving branch — a
          # silent change upstream would go straight into every AppImage.
          # A mismatch stops the release; updating a line here is a decision
          # someone makes on purpose.
          cat > "$d/SHA256SUMS" <<'SUMS'
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64
          072f17c0895a85c490282fe5395c5007e5fc75da727e553b3b8fb680feb11578  AppRun-aarch64
          e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef  linuxdeploy-x86_64.AppImage
          b12b5cc57bd0921e1f98d73f58aa364503bc1a27f54b7a69fd2870bce7fa2f55  linuxdeploy-aarch64.AppImage
          cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a  linuxdeploy-plugin-gtk.sh
          c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94  linuxdeploy-plugin-gstreamer.sh
          SUMS
          sed -i 's/^ *//' "$d/SHA256SUMS"
          check() {
            want=$(grep " $1\$" "$d/SHA256SUMS" | cut -d' ' -f1)
            got=$(sha256sum "$d/$1" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::$1 is not the file this build expects (got $got, expected ${want:-nothing})"
              rm -f "$d/$1"
              return 1
            fi
          }
          get() {
            # Failure must be visible: with `get … || fallback` the shell
            # turns off errexit inside the function, so a curl that failed
            # used to end at `echo fetched` and report success — and the
            # fallback below never ran.
            if [ -s "$d/$2" ] && check "$2"; then
              echo "cached: $2"
              return 0
            fi
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 20 -o "$d/$2" "$1" || {
              rm -f "$d/$2"
              return 1
            }
            check "$2" || return 1
            chmod +x "$d/$2"
            echo "fetched: $2"
          }
          releases=https://github.com/tauri-apps/binary-releases/releases/download
          get "$releases/apprun-old/AppRun-$arch" "AppRun-$arch"
          get "$releases/linuxdeploy/linuxdeploy-$arch.AppImage" "linuxdeploy-$arch.AppImage"
          # The two plugin scripts live on raw.githubusercontent.com, which is
          # the host that refused us. They are also vendored inside the
          # tauri-bundler crate, so a rate limit there costs nothing.
          for plugin in gtk gstreamer; do
            f=linuxdeploy-plugin-$plugin.sh
            get "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-$plugin/master/$f" "$f" || {
              echo "raw.githubusercontent refused $f — taking the crate's copy"
              v=$(curl -fsSL -A monti-ci https://crates.io/api/v1/crates/tauri-bundler \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])')
              curl -fsSL -A monti-ci --retry 5 --retry-all-errors \
                  "https://crates.io/api/v1/crates/tauri-bundler/$v/download" | tar xz -C /tmp
              install -m 755 "/tmp/tauri-bundler-$v/src/bundle/linux/appimage/$f" "$d/$f"
              check "$f" || exit 1
            }
          done
          ls -l "$d"

      # Even with the tooling in place a download can still be refused, so the
      # build itself waits a rate limit out. Anything else fails immediately:
      # a compile error does not get better on the third try.
      #
      # The pipe into tee is why this needs pipefail: without it the step
      # reported success on a failed build, and the failure surfaced two
      # steps later as "there is no AppImage here".
      - name: Build bundles
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npm run tauri build 2>&1 | tee /tmp/build.log; then
              exit 0
            fi
            if ! grep -q 'http status: 429' /tmp/build.log; then
              exit 1
            fi
            echo "::warning::bundling was rate-limited, attempt $attempt of 3"
            sleep $((attempt * 60))
          done
          exit 1

      # linuxdeploy bundles libraries from the build machine that must come
      # from the host instead. Ours are older, and a host driver that loads
      # them misses the symbols it needs: the bundled libwayland-client
      # (wayland 1.20) is why Mesa's EGL failed and the window turned white
      # in v0.4.3 and v0.4.4. The list is vendored, so a build cannot change
      # meaning because someone edited a file upstream.
      - name: Unbundle host libraries from the AppImage
        run: |
          set -euo pipefail
          list=$PWD/.github/appimage-host-libs.txt
          grep -vE '^\s*#|^\s*$' "$list" | sort -u > /tmp/host-libs
          cd src-tauri/target/release/bundle/appimage
          img=$(ls ./*.AppImage | head -1)
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          echo "${{ matrix.appimagetool_sha }}  /tmp/appimagetool" \
            | sha256sum -c -
          chmod +x /tmp/appimagetool
          rm -rf squashfs-root
          "$img" --appimage-extract > /dev/null
          while read -r lib; do
            if [ -e "squashfs-root/usr/lib/$lib" ]; then
              echo "unbundling $lib"
              rm -f "squashfs-root/usr/lib/$lib"
            fi
          done < /tmp/host-libs
          rm -f "$img"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=${{ matrix.arch }} /tmp/appimagetool squashfs-root "$img"
          rm -rf squashfs-root
          # Guard: none of them may survive into the shipped image.
          "$img" --appimage-extract > /dev/null
          left=$(ls squashfs-root/usr/lib | sort -u | comm -12 /tmp/host-libs - || true)
          if [ -n "$left" ]; then
            echo "::error::host libraries are still bundled: $left"
            exit 1
          fi
          rm -rf squashfs-root
          ls -l "$img"

      # A build that starts and draws nothing looks identical to a good one
      # from here, so check the pixels — on distributions other than the one
      # that built it.
      - name: Smoke-test the AppImage on other distributions
        run: bash .github/scripts/smoke-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage

      # The runner's logs are admin-only; put the build log somewhere the
      # maintainer can actually read when a build dies.
      - name: Publish build log on failure
        if: failure()
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs
          git reset
          cp /tmp/build.log ci-build.log || true
          git add -f ci-build.log
          git commit -m "build log for $TAG ($ARCH) run $RUN_ID"
          git push -f origin ci-logs

      - name: Hand the packages to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # One release carries both architectures, so publishing waits until every
  # build has drawn its window somewhere other than the machine it was
  # built on.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bundle
          pattern: bundles-*
          merge-multiple: true

      - name: Collect the packages and checksum them
        run: |
          set -euo pipefail
          cd bundle
          # An artifact keeps the directory structure of what was uploaded,
          # so the packages arrive under appimage/, deb/ and rpm/. Flatten
          # them: SHA256SUMS must list bare file names, which is what the
          # install script looks for.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -l
          sha256sum ./*.AppImage ./*.deb ./*.rpm | sed 's|\./||' > SHA256SUMS
          cat SHA256SUMS

      # Before the files go anywhere. The attestation is keyed by the file's
      # digest, so it holds for the copy on the release page and for any copy
      # made of it afterwards.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            bundle/*.AppImage
            bundle/*.deb
            bundle/*.rpm

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd bundle
          # What changed, taken from the changelog's newest section: the
          # release page is where someone decides whether this version is
          # worth their evening, and "download and click Add cloud" does not
          # answer that. The section for THIS tag, headings left out.
          #
          # It used to take the first "## v" heading, which is the previous
          # release whenever the changelog still carries an "## Unreleased"
          # section — publishing last version's notes under this version's
          # name. Now the section must be named after the tag, and a
          # changelog nobody renamed stops the release instead.
          awk -v want="## $TAG " 'index($0, want) == 1 {n=1; next} /^## /{n=0} n' \
            "$GITHUB_WORKSPACE/CHANGELOG.md" | sed '/./,$!d' > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::CHANGELOG.md has no section headed \"## $TAG — <date>\" — rename the Unreleased section before tagging"
            exit 1
          fi
          cat >> /tmp/notes.md <<'EOF'

          ---

          Download, install, click **Add cloud**.

          | Package | For |
          |---|---|
          | `.AppImage` | any distro — `chmod +x` and run |
          | `.deb` | Debian, Ubuntu, Mint, … |
          | `.rpm` | Fedora, openSUSE, … |

          `amd64`/`x86_64` files are for ordinary PCs, `aarch64`/`arm64` for
          ARM machines. FUSE3 is required at runtime (preinstalled on most
          desktop distros). `SHA256SUMS` lists checksums for every package;
          the install script verifies them automatically.

          Every package is signed with GitHub build provenance. A checksum says
          the file arrived intact; this says where it came from — that it was
          built by this repository's workflow, from the commit this tag points
          at, and not assembled somewhere else:

          ```
          gh attestation verify <package file> --repo stektus/monti
          ```

          Upgrading? Install over the old version — your drives, settings and
          synced folders are kept. Removing Monti later:
          `./install.sh --uninstall`.

          Every version is in
          [CHANGELOG.md](https://github.com/stektus/monti/blob/main/CHANGELOG.md),
          and earlier releases stay on this page if you need to go back.
          EOF
          head -40 /tmp/notes.md
          gh release create "$TAG" \
            --title "Monti $TAG" \
            --notes-file /tmp/notes.md \
            *.AppImage *.deb *.rpm SHA256SUMS

      # Releases are kept. Deleting the previous one breaks every link that
      # points at it — a bug report saying "0.6.0 does this", a PKGBUILD
      # pinned to a version, an install command someone pasted in a forum —
      # and it takes away the one thing a person can do when a new version
      # misbehaves: go back to the one that worked. A release that turns out
      # to be broken is marked as a pre-release by hand, with a line at the
      # top of its notes saying so; that steers people away without
      # invalidating anything.
